      <stop stop-color="#141d25"/>
      <stop offset="1" stop-color="#0a1016"/>
    </linearGradient>
    <radialGradient id="light" cx="0.1" cy="0.5" r="0.8">
      <stop stop-color="#f9ed32" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#f9ed32" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="958" height="258" rx="20" fill="url(#background)" stroke="#2f3b45" stroke-width="2"/>
  <rect x="2" y="2" width="956" height="256" rx="19" fill="url(#light)"/>
  <path d="M48 50 H80" stroke="#f9ed32" stroke-width="3" stroke-linecap="round"/>
