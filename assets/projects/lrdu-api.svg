<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Los Reyes del Usado modular commerce API</title>
  <desc id="description">PHP REST API with routing, services, repositories, JWT authorization, and MySQL.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111525"/><stop offset="1" stop-color="#20233d"/></linearGradient></defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#40466f" stroke-width="2"/>
  <text x="64" y="88" fill="#aeb7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">MODULAR COMMERCE API</text>
  <text x="64" y="145" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Los Reyes del Usado</text>
  <text x="64" y="190" fill="#afb2c8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">Catalog, authentication, RBAC, filtering, and administration.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="64" y="237" width="94" height="38" rx="19" fill="#222642" stroke="#525985"/><text x="91" y="262" fill="#ffffff">PHP 8</text>
    <rect x="170" y="237" width="100" height="38" rx="19" fill="#222642" stroke="#525985"/><text x="195" y="262" fill="#ffffff">MySQL</text>
    <rect x="282" y="237" width="84" height="38" rx="19" fill="#222642" stroke="#525985"/><text x="311" y="262" fill="#ffffff">JWT</text>
    <rect x="378" y="237" width="88" height="38" rx="19" fill="#222642" stroke="#525985"/><text x="404" y="262" fill="#ffffff">RBAC</text>
  </g>
  <g transform="translate(714 52)" font-family="Consolas, SFMono-Regular, monospace" font-size="14">
    <rect width="420" height="256" rx="16" fill="#0d1117" stroke="#525985"/>
    <circle cx="28" cy="25" r="5" fill="#ff7b72"/><circle cx="46" cy="25" r="5" fill="#d29922"/><circle cx="64" cy="25" r="5" fill="#3fb950"/>
    <text x="28" y="72" fill="#7ee787">GET</text><text x="78" y="72" fill="#c9d1d9">/api/products?page=1</text>
    <text x="28" y="105" fill="#79c0ff">200</text><text x="78" y="105" fill="#8b949e">application/json</text>
    <text x="28" y="143" fill="#c9d1d9">{</text>
    <text x="48" y="170" fill="#a5d6ff">"data"</text><text x="107" y="170" fill="#c9d1d9">: [...],</text>
    <text x="48" y="197" fill="#a5d6ff">"page"</text><text x="107" y="197" fill="#c9d1d9">: 1,</text>
    <text x="48" y="224" fill="#a5d6ff">"authorized"</text><text x="155" y="224" fill="#ff7b72">: true</text><text x="28" y="242" fill="#c9d1d9">}</text>
  </g>
</svg>
