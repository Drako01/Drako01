<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Alejandro Di Stefano — Full Stack Software Engineer</title>
  <desc id="description">Retro terminal inspired profile banner for a backend-focused full stack software engineer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d0b"/>
      <stop offset="1" stop-color="#111914"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63ff8a"/>
      <stop offset="1" stop-color="#d7ff78"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.018"/>
    </pattern>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#2a3930" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="url(#scanlines)" pointer-events="none"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace">
    <text x="72" y="62" fill="#6b8f76" font-size="16" letter-spacing="1.3">
      DRAKO01@GITHUB:~/PROFILE
    </text>

    <text x="72" y="105" fill="#63ff8a" font-size="18" filter="url(#softGlow)">
      &gt; whoami
    </text>

    <text x="72" y="157" fill="#edf7ef" font-size="40" font-weight="700" letter-spacing="0.8">
      ALEJANDRO DI STEFANO
    </text>

    <text x="72" y="203" fill="#63ff8a" font-size="24" font-weight="600" filter="url(#softGlow)">
      &gt; FULL STACK SOFTWARE ENGINEER_
    </text>

    <text x="72" y="243" fill="#9db0a2" font-size="18">
      Building scalable APIs, web products and business platforms.
    </text>

    <text x="72" y="281" fill="#d7ff78" font-size="14" letter-spacing="1.25">
      PHP  ·  GO  ·  NEXT.JS  ·  MYSQL  ·  DOCKER  ·  N8N
    </text>
  </g>

  <g transform="translate(884 55)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace">
    <rect width="244" height="210" rx="13" fill="#09100c" stroke="#2a4533" stroke-width="2"/>
    <rect x="16" y="16" width="212" height="31" rx="6" fill="#101b14" stroke="#243a2b"/>
    <circle cx="32" cy="31.5" r="4" fill="#63ff8a"/>
    <text x="46" y="36" fill="#93aa99" font-size="12" letter-spacing="1">SYSTEM STATUS</text>

    <text x="22" y="78" fill="#6b8f76" font-size="12">BACKEND</text>
    <text x="151" y="78" fill="#63ff8a" font-size="12">ONLINE</text>
    <rect x="22" y="89" width="200" height="6" rx="3" fill="#17251b"/>
    <rect x="22" y="89" width="178" height="6" rx="3" fill="url(#accent)" opacity="0.85"/>

    <text x="22" y="122" fill="#6b8f76" font-size="12">FULL STACK</text>
    <text x="151" y="122" fill="#63ff8a" font-size="12">READY</text>
    <rect x="22" y="133" width="200" height="6" rx="3" fill="#17251b"/>
    <rect x="22" y="133" width="166" height="6" rx="3" fill="url(#accent)" opacity="0.78"/>

    <text x="22" y="166" fill="#6b8f76" font-size="12">DELIVERY</text>
    <text x="151" y="166" fill="#d7ff78" font-size="12">PRODUCTION</text>
    <rect x="22" y="177" width="200" height="6" rx="3" fill="#17251b"/>
    <rect x="22" y="177" width="188" height="6" rx="3" fill="url(#accent)" opacity="0.9"/>
  </g>
</svg>
