name: Sync Open VSX profile gallery

on:
  pull_request:
    paths:
      - README.md
      - scripts/sync_open_vsx.py
      - tests/test_sync_open_vsx.py
      - requirements-profile-gallery.txt
      - 'assets/open-vsx/**'
      - assets/sections/vs-code-extensions.svg
      - .github/workflows/sync-open-vsx-profile.yml
  push:
    branches: [main]
    paths:
      - scripts/sync_open_vsx.py
      - .github/workflows/sync-open-vsx-profile.yml
  schedule:
    # Hourly check at minute 17 UTC; commit only when the catalog changes.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-open-vsx-sync
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install card renderer
        run: python -m pip install -r requirements-profile-gallery.txt
      - name: Offline contract tests
        run: python -m unittest discover -s tests -p 'test_sync_open_vsx.py' -v
      - name: Compile synchronizer
        run: python -m py_compile scripts/sync_open_vsx.py
      - name: Smoke test against live Open VSX API
        run: python scripts/sync_open_vsx.py

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install card renderer
        run: python -m pip install -r requirements-profile-gallery.txt
      - name: Do not duplicate a pending automated PR
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/open-vsx-profile-sync"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Pending gallery PR #$existing; refusing to create a duplicate." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fetch published extensions from Open VSX
        if: steps.pending.outputs.exists != 'true'
        run: python scripts/sync_open_vsx.py
      - name: Create validated PR and squash-merge via GitHub branch protection
        if: steps.pending.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/open-vsx-profile-sync"

          git add -- README.md assets/open-vsx/
          if git diff --cached --quiet; then
            echo "Open VSX catalog unchanged: no PR or commit required." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Never allow scheduled automation to update workflow or program code.
          while IFS= read -r file; do
            case "$file" in
              README.md|assets/open-vsx/*.png|assets/open-vsx/*.svg) ;;
              *) echo "::error::Unexpected generated file: $file"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)

          # PR creation with GITHUB_TOKEN does not automatically run normal
          # pull_request CI without a human's workflow approval. Validate the
          # same source and generated files here before offering the PR.
          python -m unittest discover -s tests -p 'test_sync_open_vsx.py' -q
          python -m py_compile scripts/sync_open_vsx.py

          remote_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$remote_main" == "$GITHUB_SHA" ]] || {
            echo "::error::main advanced since checkout; aborting stale PR creation"
            exit 1
          }
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::Old automation branch exists. Resolve it manually; never force-push."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "docs(profile): sync Open VSX gallery via reviewed PR"
          head_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$branch"

          cat > "$RUNNER_TEMP/gallery-pr.md" <<EOF
          ## Automated Open VSX profile gallery refresh

          Updates ONLY the generated extension cards and their designated README gallery.

          - Validation: offline contract tests and Python compilation **PASS**
          - Source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Head SHA: $head_sha
          - No source code, workflow, or unapproved file changes
          - Squash merge only if branch protection allows it; no bypass

          This PR was generated by the hourly cron or an explicit manual dispatch.
          EOF

          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main --head "$branch" \
            --title "docs(profile): hourly Open VSX gallery update" \
            --body-file "$RUNNER_TEMP/gallery-pr.md"; then
            echo "::error::Could not open bot PR. Check Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
            exit 1
          fi

          number="$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          actual_head="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
          [[ "$actual_head" == "$head_sha" ]] || {
            echo "::error::PR head changed after verification. Aborting merge."
            exit 1
          }

          # A new pull request can briefly have mergeability UNKNOWN.
          for attempt in 1 2 3; do
            state="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json mergeStateStatus --jq '.mergeStateStatus')"
            [[ "$state" != "UNKNOWN" ]] && break
            sleep 3
          done
          if ! gh pr merge "$number" --repo "$GITHUB_REPOSITORY" \
            --squash --delete-branch --match-head-commit "$head_sha"; then
            echo "::error::PR #$number was NOT merged. Review branch rules, reviews and GitHub App permissions; PR remains open."
            echo "Unmerged gallery PR: https://github.com/$GITHUB_REPOSITORY/pull/$number" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Gallery PR #$number validated and squash-merged: https://github.com/$GITHUB_REPOSITORY/pull/$number" >> "$GITHUB_STEP_SUMMARY"
